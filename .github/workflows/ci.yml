name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        # Integration tests (etl/load.py, etl/pipeline.py) need a live
        # MinIO/Postgres and skip automatically when they're not reachable —
        # see tests/conftest.py. No docker services are started here, so
        # this runs the pure-function suite; integration tests run locally
        # via `docker compose up -d minio warehouse && pytest -m integration`.
        run: pytest
