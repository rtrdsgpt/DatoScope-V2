services:
  # --- ETL data lake / warehouse (section 1) ---

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: datoscope
      MINIO_ROOT_PASSWORD: datoscope123
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  warehouse:
    image: postgres:16
    environment:
      POSTGRES_USER: datoscope
      POSTGRES_PASSWORD: datoscope123
      POSTGRES_DB: datoscope
    ports:
      - "5433:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datoscope -d datoscope"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- MLflow (tracking server + model registry, section 4) — backed by
  # the same warehouse Postgres (separate "mlflow" database) and the same
  # MinIO (separate "datoscope-mlflow" bucket) rather than new infra ---

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    depends_on:
      warehouse:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      MLFLOW_PG_HOST: warehouse
      MLFLOW_PG_USER: datoscope
      MLFLOW_PG_PASSWORD: datoscope123
      MLFLOW_PG_DB: mlflow
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: datoscope
      AWS_SECRET_ACCESS_KEY: datoscope123
      MLFLOW_BUCKET: datoscope-mlflow
    ports:
      - "5001:5000"   # 5001 to dodge macOS AirPlay Receiver's default use of 5000

  # --- API + Streamlit dev stack (section 4) ---

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    depends_on:
      warehouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      mlflow:
        condition: service_started
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: datoscope
      S3_SECRET_KEY: datoscope123
      WAREHOUSE_DSN: postgresql+psycopg2://datoscope:datoscope123@warehouse:5432/datoscope
      MLFLOW_TRACKING_URI: http://mlflow:5000
    env_file:
      - .env   # KAGGLE_API_TOKEN
    ports:
      - "8000:8000"

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run app.py --server.address 0.0.0.0 --server.port 8501
    depends_on:
      - api
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"

  # --- Airflow (LocalExecutor + its own metadata Postgres, deliberately
  # bounded -- no Celery/Redis/worker fleet, this is one daily ETL DAG) ---

  airflow-metadata:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_metadata:/var/lib/postgresql/data

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      - airflow-metadata
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-metadata/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      PYTHONPATH: /opt/airflow
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: datoscope
      S3_SECRET_KEY: datoscope123
      WAREHOUSE_DSN: postgresql+psycopg2://datoscope:datoscope123@warehouse:5432/datoscope
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./.env:/opt/airflow/.env

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      - airflow-metadata
      - airflow-init
      - minio
      - warehouse
    environment: *airflow-env
    ports:
      - "8080:8080"
    command: webserver
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./.env:/opt/airflow/.env

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      - airflow-metadata
      - airflow-init
      - minio
      - warehouse
    environment: *airflow-env
    command: scheduler
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./.env:/opt/airflow/.env

volumes:
  minio_data:
  warehouse_data:
  airflow_metadata:
