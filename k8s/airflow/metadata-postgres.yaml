# Airflow's own metadata DB — plain postgres:16 (same image the rest of this
# project uses for warehouse/mlflow Postgres, see docker-compose.yml)
# instead of the Helm chart's bundled Bitnami subchart, whose pinned image
# tag (bitnami/postgresql:16.1.0-debian-11-r15) was pulled from Docker Hub
# and returns ImagePullBackOff — see log.md section 6.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-metadata-postgres
  namespace: airflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-metadata-postgres
  template:
    metadata:
      labels:
        app: airflow-metadata-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_USER
              value: airflow
            - name: POSTGRES_PASSWORD
              value: airflow
            - name: POSTGRES_DB
              value: airflow
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "airflow", "-d", "airflow"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: airflow-metadata-postgres
  namespace: airflow
spec:
  selector:
    app: airflow-metadata-postgres
  ports:
    - port: 5432
      targetPort: 5432
