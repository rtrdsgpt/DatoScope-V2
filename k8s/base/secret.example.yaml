# Copy to secret.yaml (gitignored) and fill in real values, or generate with
# `kubectl create secret generic datoscope-secrets --namespace datoscope \
#   --from-literal=WAREHOUSE_DSN=... --from-literal=S3_ACCESS_KEY=... \
#   --from-literal=S3_SECRET_KEY=... --from-literal=KAGGLE_API_TOKEN=...`
# Never commit secret.yaml with real values.
apiVersion: v1
kind: Secret
metadata:
  name: datoscope-secrets
  namespace: datoscope
type: Opaque
stringData:
  WAREHOUSE_DSN: "postgresql+psycopg2://datoscope:changeme@warehouse:5432/datoscope"
  S3_ACCESS_KEY: "changeme"
  S3_SECRET_KEY: "changeme"
  KAGGLE_API_TOKEN: "changeme"
